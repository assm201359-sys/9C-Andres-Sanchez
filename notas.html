<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Notas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#010E26;
    color:#FFFFFF;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.contenedor{
    width:500px;
    border:2px solid #39FF14;
    border-radius:15px;
    padding:30px;
    text-align:center;
    box-shadow:0 0 20px #39FF14;
}

h1{
    color:#39FF14;
    margin-bottom:25px;
    font-size:35px;
}

label{
    display:block;
    text-align:left;
    margin-top:15px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#39FF14;
    color:#010E26;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #39FF14;
}

#resultado{
    margin-top:25px;
    font-size:22px;
}

a{
    text-decoration:none;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>🧮 Calculadora de Notas</h1>

<label>Nota 1</label>
<input type="number" id="nota1" min="0" max="5" step="0.1">

<label>Nota 2</label>
<input type="number" id="nota2" min="0" max="5" step="0.1">

<label>Nota 3</label>
<input type="number" id="nota3" min="0" max="5" step="0.1">

<button onclick="calcular()">
Calcular Promedio
</button>

<div id="resultado"></div>

<br>

<a href="menu.html">
<button>
Volver al Menú
</button>
</a>

</div>

<script>

function calcular(){

    let n1 = parseFloat(document.getElementById("nota1").value);
    let n2 = parseFloat(document.getElementById("nota2").value);
    let n3 = parseFloat(document.getElementById("nota3").value);

    if(isNaN(n1) || isNaN(n2) || isNaN(n3)){
        alert("Ingrese las tres notas.");
        return;
    }

    if(n1<0 || n1>5 || n2<0 || n2>5 || n3<0 || n3>5){
        alert("Las notas deben estar entre 0 y 5.");
        return;
    }

    let promedio = (n1+n2+n3)/3;

    let mensaje="";

    if(promedio>=3){
        mensaje="✅ ¡Aprobaste!";
    }else{
        mensaje="❌ Reprobaste.";
    }

    document.getElementById("resultado").innerHTML=
    "<h2>Promedio: "+promedio.toFixed(2)+"</h2><br>"+mensaje;

}

</script>

</body>
</html>
